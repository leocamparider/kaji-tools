<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  :root {
    --void: #0A0A0C; --panel: #151519; --panel2: #1C1C22; --border: #2A2A32;
    --text: #EDEDEF; --muted: #87878F; --accent: #5EEAD4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--void); font-family: 'Inter', sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 20px;
  }
  .title { color: var(--text); font-weight: 700; font-size: 14px; margin-bottom: 18px; }
  .row { margin-bottom: 16px; }
  .row-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .label { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .value { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .result { background: var(--panel2); border-radius: 8px; padding: 16px; margin-top: 8px; }
  .result-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .result-value { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; margin-bottom: 4px; }
  .result-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  canvas { max-height: 160px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Investment Calculator</div>

    <div class="row">
      <div class="row-head"><span class="label">Importo iniziale</span><span class="value" id="startVal">€1000</span></div>
      <input type="range" id="start" min="0" max="20000" step="100" value="1000">
    </div>
    <div class="row">
      <div class="row-head"><span class="label">Deposito mensile</span><span class="value" id="monthlyVal">€200</span></div>
      <input type="range" id="monthly" min="0" max="2000" step="50" value="200">
    </div>
    <div class="row">
      <div class="row-head"><span class="label">Orizzonte temporale</span><span class="value" id="yearsVal">10 anni</span></div>
      <input type="range" id="years" min="1" max="40" step="1" value="10">
    </div>
    <div class="row">
      <div class="row-head"><span class="label">Rendimento annuo</span><span class="value" id="rateVal">8%</span></div>
      <input type="range" id="rate" min="0" max="20" step="0.5" value="8">
    </div>

    <div class="result">
      <div class="result-label">Saldo proiettato</div>
      <div class="result-value" id="finalBalance">€0</div>
      <div class="result-sub" id="freeMoney">+€0 da interessi composti</div>
      <canvas id="chart"></canvas>
    </div>
  </div>

<script>
  const fmt = n => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);

  const els = {
    start: document.getElementById('start'),
    monthly: document.getElementById('monthly'),
    years: document.getElementById('years'),
    rate: document.getElementById('rate'),
  };

  const ctx = document.getElementById('chart').getContext('2d');
  let chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{
      data: [], borderColor: '#5EEAD4', borderWidth: 2, pointRadius: 0,
      fill: true, backgroundColor: 'rgba(94,234,212,0.15)', tension: 0.3
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: (c) => fmt(c.parsed.y) }
      }},
      scales: {
        x: { grid: { color: '#2A2A32' }, ticks: { color: '#87878F', font: { size: 10 } } },
        y: { grid: { color: '#2A2A32' }, ticks: { color: '#87878F', font: { size: 10 },
          callback: v => (v/1000) + 'k' } }
      }
    }
  });

  function recalc() {
    const start = Number(els.start.value);
    const monthly = Number(els.monthly.value);
    const years = Number(els.years.value);
    const rate = Number(els.rate.value);

    document.getElementById('startVal').textContent = fmt(start);
    document.getElementById('monthlyVal').textContent = fmt(monthly);
    document.getElementById('yearsVal').textContent = years + ' anni';
    document.getElementById('rateVal').textContent = rate + '%';

    const monthlyRate = rate / 100 / 12;
    let balance = start;
    const labels = [0];
    const points = [Math.round(balance)];
    for (let m = 1; m <= years * 12; m++) {
      balance = balance * (1 + monthlyRate) + monthly;
      if (m % 12 === 0) {
        labels.push(m / 12);
        points.push(Math.round(balance));
      }
    }

    const finalBalance = points[points.length - 1];
    const totalDeposited = start + monthly * years * 12;
    const freeMoney = finalBalance - totalDeposited;

    document.getElementById('finalBalance').textContent = fmt(finalBalance);
    document.getElementById('freeMoney').textContent = '+' + fmt(freeMoney) + ' da interessi composti';

    chart.data.labels = labels.map(y => 'Anno ' + y);
    chart.data.datasets[0].data = points;
    chart.update();
  }

  Object.values(els).forEach(el => el.addEventListener('input', recalc));
  recalc();
</script>
</body>
</html>
